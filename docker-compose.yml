# Local container: SPA on http://localhost:8080
services:
  noto:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_BASE_URL: /
        VITE_APP_TITLE: Noto
    image: noto:local
    ports:
      - '8080:8080'
    restart: unless-stopped
    # Mirrors Dockerfile HEALTHCHECK against /healthz
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8080/healthz']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
